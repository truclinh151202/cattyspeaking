 if(s=='C'){h+=`<div class=card><h2>C. Học cụm từ hữu ích</h2></div>`+PH.map((p,i)=>`<div class=card><h3>${p[0]}</h3>${p[3]?`<div class=ipa>${p[3]}</div>`:''}<p>${p[1]}<br><span class=mut>${p[2]}</span></p><div class=row><button class=b2 data-a=say data-t="${p[0]}">🔊 Nghe</button></div>${recUI('c'+i)}</div>`).join('')}
 if(s=='D'){h+=`<div class=card><h2>D. Nghe hiểu</h2><p class=mut>Nghe lại hội thoại nếu cần.</p><button class=b2 data-a=pb id=pb>▶ Nghe cả đoạn</button></div>`+Q.map((q,i)=>{const r=QR[i];return `<div class=card><p><b>${i+1}. ${q.q}</b></p>${q.t=='mc'?q.o.map(o=>`<label class=o><input type=radio name=q${i} data-q=${i} value="${o}" ${QA[i]==o?'checked':''}> ${o}</label>`).join(''):`<input type=text data-q=${i} value="${esc(QA[i]||'')}" placeholder="Câu trả lời">`}${r?`<p class="${r.ok?'done':'retry'}">${r.ok?'✓ Đúng':'✗ Chưa đúng'} — ${q.x}</p>`:''}</div>`}).join('')+`<div class=card><button data-a=quiz>Nộp bài</button>${S.quiz?`<p>Kết quả gần nhất: <b>${S.quiz.score}/${S.quiz.total}</b></p>`:''}</div>`}
 if(s=='E')h+=`<div class=card><h2>E. Nói với ít hỗ trợ dần</h2><p class=mut>Người bán nói trước, bạn trả lời. Xin gợi ý không bị trừ điểm — hệ thống chỉ ghi lại để bạn thấy tiến bộ.</p></div>`+['e1','e2','e3'].map(task).join('');
 if(s=='F')h+=`<div class=card><h2>F. Áp dụng vào tình huống mới</h2><p class=mut>Không có đáp án mẫu trước khi bạn thử. Sau phản hồi, bạn có thể ghi âm lại.</p></div>`+task('f');
 if(s=='G')h+=`<div class=card><h2>G. Tự đánh giá</h2>`+SC.map((q,i)=>`<p><b>${q}</b></p><div class=row>${[['yes','Có'],['some','Một chút'],['no','Chưa']].map(o=>`<button class="${S.assess[i]==o[0]?'':'b2'}" data-a=as data-q=${i} data-v=${o[0]}>${o[1]}</button>`).join('')}</div>`).join('')+`<p class=mut>Đây là cảm nhận của chính bạn. Thời gian học và số xu không chứng minh khả năng giao tiếp.</p></div>`;
 const ok=gate();h+=`<div class=row><button class=b2 data-a=prev ${step==0?'disabled':''}>← Quay lại</button><button data-a=next ${!ok||step==6?'disabled':''}>Tiếp tục →</button></div>${step==6?(S.done.includes('G')?'<div class=hint>🎉 Bạn đã hoàn thành bài học! Hãy ghé Góc thú cưng để dùng xu, hoặc sang Ôn tập để luyện lại.</div>':'<p class=mut>Đây là bước cuối. Hãy trả lời cả hai câu để hoàn thành bài.</p>'):!ok?'<p class=mut>Hãy thử bước này một lần để tiếp tục.</p>':''}`;return h}
function gate(){const s=STEPS[step],t=S.tries;return s=='A'?(t.a||S.cant):s=='E'?(t.e1&&t.e2&&t.e3):s=='F'?t.f:s=='D'?!!S.quiz:s=='G'?false:true}
function vReview(){const lab=['a','e1','e2','e3','f'].filter(k=>S.last[k]&&S.last[k]!=='done');return `<h1>Ôn tập</h1><div class=card><h2>Cụm từ đã học</h2>${PH.map(p=>`<p><b>${p[0]}</b> — ${p[1]} <button class=b2 data-a=say data-t="${p[0]}" style="min-height:34px;padding:4px 10px">🔊</button></p>`).join('')}</div><div class=card><h2>Bài nói cần thử lại</h2>${lab.length?lab.map(k=>`<p>${R[k].goal} <span class=${LB[S.last[k]][1]}>(${LB[S.last[k]][0]})</span> <button class=b2 data-a=retry data-k=${k}>Luyện lại</button></p>`).join(''):'<p class=mut>Chưa có bài nào cần thử lại.</p>'}</div>`}
function vProg(){const sp=S.support,c=l=>sp.filter(x=>x.lvl==l).length,hn=sp.filter(x=>x.hint).length;const A=['yes','some','no'],an={yes:'Có',some:'Một chút',no:'Chưa'};
 return `<h1>Tiến trình</h1><div class=card><h3>Bước đã hoàn thành</h3><p>${S.done.length?S.done.map(x=>x+'. '+SN[STEPS.indexOf(x)]).join(' · '):'Chưa có'}</p><h3>Nghe hiểu</h3><p>${S.quiz?S.quiz.score+'/'+S.quiz.total+' ('+S.quiz.d+')':'Chưa làm'}</p><h3>Hỗ trợ đã dùng khi nói</h3><p>Mẫu đầy đủ: ${c(1)} · Gợi ý từ khoá: ${c(2)} · Chỉ ảnh + mục tiêu: ${c(3)} · Bấm xin gợi ý: ${hn} lần. <span class=mut>(Dùng hỗ trợ là bình thường.)</span></p><h3>Tự đánh giá</h3><p>${esc(SC[0])}: ${an[S.assess[0]]||'—'}<br>${esc(SC[1])}: ${an[S.assess[1]]||'—'}</p></div>
 ${S.saveHist&&S.hist.length?`<div class=card><h3>Lịch sử phản hồi</h3>${S.hist.slice(-10).reverse().map(h=>`<p class=mut>${h.d} · ${esc(h.k)} · ${LB[h.label][0]} · “${esc(h.text)}”</p>`).join('')}</div>`:''}
 <div class=card><h3>Dữ liệu & quyền riêng tư</h3><p class=mut>• ${AI?'Khi bạn bấm Kiểm tra hoặc Tạo bài, <b>văn bản</b> (câu trả lời hoặc mô tả tình huống) được gửi qua máy chủ tới dịch vụ AI (không gửi bản ghi âm).':'Phiên bản demo này <b>không gửi gì tới dịch vụ AI</b>.'} Tiến trình lưu trong trình duyệt của bạn (localStorage) và <b>không tự đồng bộ giữa các thiết bị</b>.<br>• Bản ghi âm chỉ ở bộ nhớ tạm, không lưu lâu dài.<br>• Nếu trình duyệt (như Chrome) dùng nhận dạng giọng nói, âm thanh có thể được gửi tới nhà cung cấp trình duyệt để chuyển thành chữ.<br>• Nếu sau này kết nối AI, văn bản câu trả lời (không phải bản ghi) sẽ được gửi qua máy chủ của bạn; khoá API không bao giờ nằm trong trang web.</p><label><input type=checkbox data-a=hist ${S.saveHist?'checked':''}> Lưu lịch sử phản hồi & lần thử lại</label><div class=row><button class=b2 data-a=del>🗑 Xoá toàn bộ dữ liệu</button></div></div>`}
function vPet(){const fed=Date.now()-S.fedAt<864e5;return `<h1>Góc thú cưng</h1><div class=card>${pet()}<p style="text-align:center">${fed?'Mèo đang vui 😸':'Mèo luôn sẵn sàng học cùng bạn 😸'} · 🪙 ${S.coins}</p><p><input type=text id=pn value="${esc(S.pet)}" maxlength=20 data-a=pname><span class=mut>Đặt tên cho thú cưng</span></p></div><div class=card><h3>Thức ăn</h3><p>🥣 ${S.food||0} <span>phần thưởng thức ăn</span></p><button data-a=feedReward ${!S.food?'disabled':''}>Cho mèo ăn phần thưởng</button><p class=mut>Hoàn thành nhiệm vụ nói để nhận thức ăn. Mỗi nhiệm vụ nhận một lần.</p><div class=row>${FOOD.map((f,i)=>`<button class=b2 data-a=feed data-i=${i}>${f[0]} ${f[1]} · ${f[2]}🪙</button>`).join('')}</div></div><div class=card><h3>Phụ kiện</h3>${ACC.map((a,i)=>`<p>${a[0]} ${a[1]} ${S.owned.includes(i)?`<button class=b2 data-a=wear data-i=${i}>${S.worn.includes(a[0])?'Bỏ ra':'Đeo'}</button>`:`<button data-a=buy data-i=${i}>Mua · ${a[2]}🪙</button>`}</p>`).join('')}</div>`}
const NAV=[['home','🏠','Trang chủ'],['lesson','📖','Bài học'],['review','🔁','Ôn tập'],['progress','📊','Tiến trình'],['pet','🐱','Thú cưng']];
function render(){const V={home:vHome,lesson:vLesson,review:vReview,progress:vProg,pet:vPet2};const f=document.activeElement,id=f&&f.id,pos=f&&f.selectionStart;$('#app').innerHTML=languageBar()+V[view]();$('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]==view?'on':''}" data-a=go data-v=${n[0]}>${n[1]}<br>${n[2]}</button>`).join('');localize();if(id&&$('#'+id)){$('#'+id).focus()}}
/* ---- actions ---- */
const A={go(d){stopPl();view=d.v;scrollTo(0,0);render()},step(d){stopPl();step=+d.i;render()},
 say(d){say(d.t)},pb(){pl.on?stopPl():playFrom(pl.i||0)},one(d){pl.on=false;pl.id++;hi(+d.i);say(T[d.i][1])},
 rate(d,t){rate=+t.value},sen(d,t){S.sen=t.checked;save();render()},sipa(d,t){S.sipa=t.checked;save();render()},svi(d,t){S.svi=t.checked;save();render()},
 rec(d){toggleRec(d.k)},play(d){try{new Audio(rec[d.k]).play()}catch(e){toast('Không phát được bản ghi')}},
 hint(d){H[d.k]=1;render()},wrong(d){msgs[d.k]='Bạn có thể ghi âm lại hoặc sửa chữ ở ô bên trên. Phản hồi tiếp theo sẽ dựa trên văn bản đã sửa.';render();const i=$('#tx-'+d.k);i&&i.focus()},
 chk(d){const k=d.k,c=R[k],raw=(TX[k]||'').trim();msgs[k]='';if(!raw){fb[k]={empty:1};render();return}
  const r=evalAns(raw,c.tk);fb[k]=Object.assign(r,{edited:!!ED[k]&&!!ASRT[k],text:raw});const first=!S.tries[k];S.tries[k]=(S.tries[k]||0)+1;S.last[k]=r.label;
  S.support.push({k,lvl:c.lvl||1,hint:!!H[k],d:today()});if(S.saveHist){S.hist.push({k,label:r.label,text:raw.slice(0,200),d:today()});S.hist=S.hist.slice(-50)}
  if(r.label==='done')petReward(k);earn('try:'+k,2);if(!first)earn('retry:'+k,2);if(S.tries.a)markDone('A');if(S.tries.e1&&S.tries.e2&&S.tries.e3)markDone('E');if(S.tries.f)markDone('F');save();render();aiFb(k,c,raw)},
 cant(){S.cant=true;earn('cant',2);S.support.push({k:'a',lvl:1,hint:false,d:today(),cant:1});markDone('A');save();render()},
 quiz(){const n=s=>String(s).toLowerCase().replace(/[$.,!?]/g,'').replace(/\b(dollars?|usd)\b/g,'').replace(/\s+/g,' ').trim();let sc=0;
  Q.forEach((q,i)=>{const v=n(QA[i]||'');const ok=q.t=='mc'?v===n(q.a):q.a.includes(v);QR[i]={ok};if(ok)sc++});S.quiz={score:sc,total:Q.length,d:today()};markDone('D');render()},
 next(){const s=STEPS[step];markDone(s);if(step<6)step++;scrollTo(0,0);render()},prev(){step=Math.max(0,step-1);render()},
 as(d){S.assess[d.q]=d.v;save();if(S.assess[0]&&S.assess[1]){markDone('G')}render()},
 retry(d){view='lesson';step=d.k=='a'?0:d.k=='f'?5:4;render()},
 topic(){genLesson()},useL(d){useLesson(d.id);view='lesson';scrollTo(0,0);render()},delL(d){if(!confirm('Xoá bài này khỏi thiết bị?'))return;S.custom=S.custom.filter(l=>l.id!==d.id);delete S.prog[d.id];if(LID===d.id)useLesson('fruit',1);save();render()},
 hist(d,t){S.saveHist=t.checked;if(!t.checked)S.hist=[];save();render()},
 del(){if(confirm('Xoá toàn bộ tiến trình, xu và thú cưng trên thiết bị này?')){try{localStorage.removeItem(K)}catch(e){}S=def();useLesson('fruit',1);Object.keys(rec).forEach(k=>delete rec[k]);Object.keys(fb).forEach(k=>delete fb[k]);Object.keys(TX).forEach(k=>delete TX[k]);view='home';step=0;render();toast('Đã xoá dữ liệu')}},
 feed(d){const f=FOOD[d.i];if(S.coins<f[2]){toast('Chưa đủ xu');return}S.coins-=f[2];S.fedAt=Date.now();save();toast(f[0]+' Mèo ăn ngon!');render()},
 buy(d){const a=ACC[d.i];if(S.coins<a[2]){toast('Chưa đủ xu');return}S.coins-=a[2];S.owned.push(+d.i);S.worn.push(a[0]);save();render()},
 wear(d){const e=ACC[d.i][0];S.worn=S.worn.includes(e)?S.worn.filter(x=>x!==e):S.worn.concat(e);save();render()},
 pname(){},lang(d,t){S.lang=t.value;save();render()},feedReward(){if(!S.food)return;S.food--;S.fedAt=Date.now();petMood='eat';save();render();toast('Mèo ăn ngon!');setTimeout(()=>{petMood='idle';render()},3000)},meow(){petMood='wave';render();setTimeout(()=>{petMood='idle';render()},1800);const g=document.querySelector('.catg');if(g){g.classList.remove('hop');void g.getBoundingClientRect();g.classList.add('hop')}toast(`Meo~ 😺`)},wall(d){S.wall=d.c;save();render()},buyA(d){if(S.own2.includes(d.k))return;const a=ACS[d.k];if(S.coins<a.p){toast(`Chưa đủ xu`);return}S.coins-=a.p;S.own2.push(d.k);S.wear[a.s]=d.k;save();render()},wearA(d){const a=ACS[d.k];S.wear[a.s]=S.wear[a.s]==d.k?null:d.k;save();render()},buyR(d){if(S.own2.includes('r:'+d.k))return;const r=RM[d.k];if(S.coins<r[2]){toast(`Chưa đủ xu`);return}S.coins-=r[2];S.own2.push('r:'+d.k);S.room.push(d.k);save();render()},placeR(d){S.room=S.room.includes(d.k)?S.room.filter(x=>x!==d.k):S.room.concat(d.k);save();render()}};
document.body.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT'||t.tagName==='INPUT')return;A[t.dataset.a]&&A[t.dataset.a](t.dataset,t)});
document.body.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'||t.type==='checkbox'){const f=A[t.dataset.a];f&&f(t.dataset,t)}});
document.body.addEventListener('input',e=>{const t=e.target;if(t.id==='topic')TOP=t.value;if(t.dataset.k&&t.id.indexOf('tx-')==0){TX[t.dataset.k]=t.value;if(ASRT[t.dataset.k]&&t.value!==ASRT[t.dataset.k])ED[t.dataset.k]=true}
 else if(t.dataset.q!==undefined)QA[t.dataset.q]=t.value;else if(t.dataset.a==='pname'){S.pet=t.value.trim()||'Mèo Con';save()}});

const DICT={};
function add(vi,en,zh){DICT[vi]=[en,zh]}
function tr(t){if(!S.lang||S.lang==='vi')return t;const i=S.lang==='zh-TW'?1:0;let out=t;for(const [a,b] of Object.entries(DICT).sort((x,y)=>y[0].length-x[0].length))out=out.split(a).join(b[i]);return out}
function languageBar(){return `<header class=language-bar><span class=brand>🐾 CattySpeaking</span><label>🌐 <select data-a=lang aria-label="Language"><option value=vi ${S.lang==='vi'?'selected':''}>Tiếng Việt</option><option value=en ${S.lang==='en'?'selected':''}>English</option><option value=zh-TW ${S.lang==='zh-TW'?'selected':''}>繁體中文</option></select></label></header>`}
function localize(){document.documentElement.lang=S.lang||'vi';if(S.lang==='vi')return;for(const root of [$('#app'),$('#nav'),$('#demo')]){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentElement.closest('[data-a=lang],.ipa,input,textarea,script'))continue;n.nodeValue=tr(n.nodeValue)}root.querySelectorAll('[placeholder]').forEach(e=>e.placeholder=tr(e.placeholder))}}
